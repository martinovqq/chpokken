<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>С днем рождения, котик мой</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="heart"></canvas>
    <script>
        (function(){
            var rAF = window.requestAnimationFrame || function(cb){setTimeout(cb,16)};
            var isMobile = /android|webos|iphone|ipad|ipod/i.test((navigator.userAgent||'').toLowerCase());
            var canvas = document.getElementById('heart');
            var ctx = canvas.getContext('2d');
            var width, height, rand = Math.random;
            var dpr = Math.min(window.devicePixelRatio || 1, 2);

            function resize(){
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, width, height);
            }
            resize();
            window.addEventListener('resize', resize);

            function getTextPoints(text, fontSize){
                var off = document.createElement('canvas');
                var octx = off.getContext('2d');
                var font = 'bold ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
                octx.font = font;
                var w = Math.ceil(octx.measureText(text).width) + 40;
                var h = Math.ceil(fontSize * 1.6);
                off.width = w; off.height = h;
                octx.font = font;
                octx.fillStyle = '#fff';
                octx.textBaseline = 'middle';
                octx.fillText(text, 20, h/2);
                var d = octx.getImageData(0, 0, w, h).data;
                var pts = [], step = isMobile ? 4 : 2;
                for(var y = 0; y < h; y += step){
                    for(var x = 0; x < w; x += step){
                        if(d[((y * w + x) << 2) + 3] > 128) pts.push([x - w/2, y - h/2]);
                    }
                }
                return pts;
            }

            function heartPos(rad){
                return [Math.pow(Math.sin(rad), 3), -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))];
            }
            function trans(pos, sx, sy, dx, dy){ return [dx + pos[0] * sx, dy + pos[1] * sy]; }

            var fontSize = isMobile ? Math.min(38, Math.floor(width / 10)) : Math.min(100, Math.floor(width / 12));
            var textPts = getTextPoints("С днем рождения, котик мой", fontSize);

            var heartPts = [];
            var dr = isMobile ? 0.4 : 0.1;
            for(var i = 0; i < Math.PI * 2; i += dr) heartPts.push(trans(heartPos(i), 210, 13, 0, 0));
            for(var i = 0; i < Math.PI * 2; i += dr) heartPts.push(trans(heartPos(i), 150, 9, 0, 0));
            for(var i = 0; i < Math.PI * 2; i += dr) heartPts.push(trans(heartPos(i), 90, 5, 0, 0));

            var hCount = heartPts.length;
            var tCount = textPts.length;
            var total = hCount + tCount;
            var targets = [];

            function pulse(kx, ky){
                for(var i = 0; i < hCount; i++){
                    targets[i] = [kx * heartPts[i][0] + width/2, ky * heartPts[i][1] + height/2 - (isMobile ? 60 : 160)];
                }
                var ty = isMobile ? 80 : 200;
                for(var i = 0; i < tCount; i++){
                    targets[hCount + i] = [textPts[i][0] + width/2, textPts[i][1] + height/2 + ty];
                }
            }

            var traceCount = isMobile ? 10 : 35;
            var particles = [];
            for(var i = 0; i < total; i++){
                var isText = i >= hCount;
                var x = rand() * width, y = rand() * height;
                var hue = isText ? 340 : 345;
                var sat = isText ? 90 : 70;
                var light = isText ? (80 + ~~(15 * rand())) : (50 + ~~(20 * rand()));
                var alpha = isText ? 0.7 : 0.3;
                particles[i] = {
                    vx: 0, vy: 0,
                    speed: rand() * 3 + 4,
                    q: ~~(rand() * total),
                    D: 2 * (i % 2) - 1,
                    force: 0.2 * rand() + 0.7,
                    color: 'hsla(' + hue + ',' + sat + '%,' + light + '%,' + alpha + ')',
                    size: isText ? 3 : 1.5,
                    trace: []
                };
                for(var k = 0; k < traceCount; k++) particles[i].trace[k] = {x: x, y: y};
            }

            var time = 0;
            function loop(){
                var n = -Math.cos(time);
                pulse((1 + n) * 0.5, (1 + n) * 0.5);
                time += (Math.sin(time) < 0 ? 9 : (n > 0.8 ? 0.2 : 1)) * 0.01;
                ctx.fillStyle = "rgba(0,0,0,0.12)";
                ctx.fillRect(0, 0, width, height);

                for(var i = particles.length; i--; ){
                    var p = particles[i];
                    var q = targets[p.q];
                    var dx = p.trace[0].x - q[0];
                    var dy = p.trace[0].y - q[1];
                    var len = Math.sqrt(dx * dx + dy * dy) || 1;
                    if(len < 10){
                        if(rand() > 0.95) p.q = ~~(rand() * total);
                        else { if(rand() > 0.99) p.D *= -1; p.q += p.D; p.q = (p.q % total + total) % total; }
                    }
                    p.vx += -dx / len * p.speed;
                    p.vy += -dy / len * p.speed;
                    p.trace[0].x += p.vx;
                    p.trace[0].y += p.vy;
                    p.vx *= p.force;
                    p.vy *= p.force;
                    for(var k = 0; k < p.trace.length - 1; k++){
                        var T = p.trace[k], N = p.trace[k + 1];
                        N.x -= 0.4 * (N.x - T.x);
                        N.y -= 0.4 * (N.y - T.y);
                    }
                    ctx.fillStyle = p.color;
                    for(var k = 0; k < p.trace.length; k++){
                        ctx.fillRect(p.trace[k].x, p.trace[k].y, p.size, p.size);
                    }
                }
                rAF(loop);
            }
            loop();
        })();
    </script>
</body>
</html>
